apiVersion: apps/v1
kind: Deployment
metadata:
  name: terrain-classifier
  labels:
    app: terrain-classifier
    version: v2.0
spec:
  replicas: 3
  selector:
    matchLabels:
      app: terrain-classifier
  template:
    metadata:
      labels:
        app: terrain-classifier
        version: v2.0
    spec:
      containers:
      - name: terrain-classifier
        image: satellite-terrain-classifier:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
          name: http
          protocol: TCP
        env:
        - name: TF_FORCE_GPU_ALLOW_GROWTH
          value: "true"
        - name: WORKERS
          value: "4"
        - name: LOG_LEVEL
          value: "info"
        resources:
          requests:
            memory: "4Gi"
            cpu: "2000m"
            nvidia.com/gpu: "1"
          limits:
            memory: "8Gi"
            cpu: "4000m"
            nvidia.com/gpu: "1"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
        volumeMounts:
        - name: model-storage
          mountPath: /app/models
        - name: config
          mountPath: /app/config
      volumes:
      - name: model-storage
        persistentVolumeClaim:
          claimName: model-pvc
      - name: config
        configMap:
          name: terrain-classifier-config
      nodeSelector:
        accelerator: nvidia-tesla-t4
---
apiVersion: v1
kind: Service
metadata:
  name: terrain-classifier-service
  labels:
    app: terrain-classifier
spec:
  type: LoadBalancer
  ports:
  - port: 80
    targetPort: 8000
    protocol: TCP
    name: http
  selector:
    app: terrain-classifier
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: terrain-classifier-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: terrain-classifier
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
      - type: Percent
        value: 100
        periodSeconds: 30
      - type: Pods
        value: 2
        periodSeconds: 60
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: model-pvc
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 50Gi
  storageClassName: fast-ssd
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: terrain-classifier-config
data:
  config.yaml: |
    model:
      architecture: efficientnetv2
      variant: B2
      num_classes: 10

    api:
      host: 0.0.0.0
      port: 8000
      workers: 4

    monitoring:
      prometheus: true
      log_level: info
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: terrain-classifier-pdb
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: terrain-classifier
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: terrain-classifier-ingress
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
spec:
  tls:
  - hosts:
    - api.terrain-classifier.example.com
    secretName: terrain-classifier-tls
  rules:
  - host: api.terrain-classifier.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: terrain-classifier-service
            port:
              number: 80
