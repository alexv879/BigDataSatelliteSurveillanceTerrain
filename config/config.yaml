# Hydra Configuration for Satellite Terrain Classification
# Modern configuration management for reproducible experiments

# Model Configuration
model:
  architecture: "efficientnetv2"  # Options: vit, efficientnetv2, resnet50, custom_cnn
  variant: "B2"  # For EfficientNet: B0, B1, B2, B3
  input_shape: [224, 224, 3]
  num_classes: 10
  pretrained: true
  fine_tune_layers: 50
  dropout_rate: 0.3
  use_attention: true

  # Vision Transformer specific
  vit:
    patch_size: 16
    projection_dim: 768
    num_heads: 12
    transformer_layers: 12
    mlp_head_units: [2048, 1024]

# Training Configuration
training:
  batch_size: 32
  epochs: 100
  initial_learning_rate: 0.001
  optimizer: "adamw"  # Options: adam, adamw, sgd
  weight_decay: 0.0001
  gradient_clip_norm: 1.0

  # Mixed precision
  mixed_precision: true

  # Progressive training
  progressive:
    enabled: true
    frozen_epochs: 10
    fine_tune_epochs: 20

  # Learning rate schedule
  lr_schedule:
    type: "cosine_annealing"  # Options: cosine_annealing, reduce_on_plateau, exponential
    warmup_epochs: 5
    min_lr: 1.0e-7

  # Early stopping
  early_stopping:
    enabled: true
    patience: 15
    monitor: "val_accuracy"
    mode: "max"

# Data Configuration
data:
  train_dir: "data/train"
  val_dir: "data/val"
  test_dir: "data/test"

  # Augmentation
  augmentation:
    use_advanced: true
    use_mixup: true
    use_cutmix: true
    use_randaugment: true

    mixup_alpha: 0.2
    cutmix_alpha: 1.0
    randaugment_n: 2
    randaugment_m: 10

    # Albumentations
    horizontal_flip_prob: 0.5
    vertical_flip_prob: 0.3
    rotation_limit: 45
    brightness_limit: 0.2
    contrast_limit: 0.2

  # Data loading
  num_workers: 4
  prefetch_buffer: 2
  cache: true

# Self-Supervised Learning Configuration
ssl:
  enabled: false
  method: "simclr"  # Options: simclr, dino, mae

  simclr:
    temperature: 0.5
    projection_dim: 128
    hidden_dim: 2048
    epochs: 100
    batch_size: 256

# MLOps Configuration
mlops:
  experiment_tracking:
    use_mlflow: true
    use_wandb: true
    project_name: "satellite-terrain-classification"

  model_versioning:
    enabled: true
    registry_path: "models/registry"

  checkpointing:
    save_best_only: true
    monitor: "val_accuracy"
    mode: "max"

# Interpretability Configuration
interpretability:
  gradcam:
    enabled: true
    layer_name: null  # Auto-detect if null

  uncertainty:
    enabled: true
    mc_iterations: 100

  save_visualizations: true
  visualization_dir: "visualizations"

# Optimization Configuration
optimization:
  quantization:
    enabled: false
    method: "int8"  # Options: int8, float16

  pruning:
    enabled: false
    target_sparsity: 0.5

  tensorrt:
    enabled: false
    precision: "fp16"

# Deployment Configuration
deployment:
  model_name: "terrain_classifier"
  model_version: "1.0.0"

  api:
    host: "0.0.0.0"
    port: 8000
    workers: 4
    enable_cors: true

  monitoring:
    prometheus: true
    log_predictions: true

# Logging Configuration
logging:
  level: "INFO"  # Options: DEBUG, INFO, WARNING, ERROR
  format: "detailed"
  save_to_file: true
  log_dir: "logs"

# Hardware Configuration
hardware:
  gpu:
    enabled: true
    memory_growth: true
    device_id: 0

  distributed:
    enabled: false
    strategy: "mirrored"  # Options: mirrored, multi_worker_mirrored

# Reproducibility
seed: 42
deterministic: true
